<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Mint gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5adfbe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8f5e2;stop-opacity:1" />
    </linearGradient>

    <!-- Clip path for rounded corners -->
    <clipPath id="round">
      <rect width="900" height="220" rx="0" ry="0"/>
    </clipPath>

    <!-- Logo box clip -->
    <clipPath id="logo-clip">
      <rect x="320" y="22" width="260" height="52" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)" />

  <!-- Dot grid overlay -->
  <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(13,45,37,0.13)" />
  </pattern>
  <rect width="900" height="220" fill="url(#dots)" />

  <!-- Floating code strings (decorative) -->
  <text x="18"  y="42"  font-family="monospace" font-size="11" fill="rgba(13,45,37,0.18)" transform="rotate(-3,18,42)">const dev = 'saksham';</text>
  <text x="680" y="35"  font-family="monospace" font-size="10" fill="rgba(13,45,37,0.15)" transform="rotate(4,680,35)">&lt;div class="hero"&gt;</text>
  <text x="10"  y="175" font-family="monospace" font-size="10" fill="rgba(13,45,37,0.14)" transform="rotate(-2,10,175)">npm install react</text>
  <text x="730" y="185" font-family="monospace" font-size="10" fill="rgba(13,45,37,0.16)" transform="rotate(3,730,185)">flex-wrap: wrap;</text>
  <text x="40"  y="210" font-family="monospace" font-size="9"  fill="rgba(13,45,37,0.12)" transform="rotate(-1,40,210)">git commit -m "init"</text>
  <text x="600" y="210" font-family="monospace" font-size="9"  fill="rgba(13,45,37,0.13)">export default App;</text>
  <text x="750" y="100" font-family="monospace" font-size="9"  fill="rgba(13,45,37,0.12)" transform="rotate(6,750,100)">useState(null)</text>
  <text x="8"   y="115" font-family="monospace" font-size="9"  fill="rgba(13,45,37,0.12)" transform="rotate(-4,8,115)">border-radius: 8px;</text>
  <text x="820" y="60"  font-family="monospace" font-size="9"  fill="rgba(13,45,37,0.12)" transform="rotate(2,820,60)">async/await</text>
  <text x="600" y="68"  font-family="monospace" font-size="9"  fill="rgba(13,45,37,0.10)">gsap.to('.el',{})</text>

  <!-- Logo mark box: <oo/> -->
  <rect x="386" y="20" width="128" height="44" rx="10" fill="rgba(13,45,37,0.18)" stroke="rgba(13,45,37,0.15)" stroke-width="1"/>
  <text x="450" y="49" font-family="monospace" font-size="22" font-weight="700" fill="rgba(13,45,37,0.85)" text-anchor="middle">&lt;oo/&gt;</text>

  <!-- "hello, i am" -->
  <text x="450" y="102" font-family="Georgia, serif" font-size="15" fill="rgba(13,45,37,0.78)" text-anchor="middle">
    hello, <tspan font-style="italic" font-weight="600">i am</tspan>
  </text>

  <!-- Main name -->
  <text x="450" y="148" font-family="Arial Black, Arial, sans-serif" font-size="46" font-weight="900" fill="#0d2d25" text-anchor="middle" letter-spacing="-1">Saksham Zalpuri</text>

  <!-- Role -->
  <text x="450" y="178" font-family="monospace" font-size="14" fill="rgba(13,45,37,0.72)" text-anchor="middle" letter-spacing="1">Frontend Developer</text>
</svg>
